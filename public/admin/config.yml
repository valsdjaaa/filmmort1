backend:
  name: github
  repo: valsdjaaa/filmmort1
  branch: main
  identity: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "texts"
    label: "Tekstovi"
    folder: "src/content/texts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Kicker", name: "kicker", widget: "string", required: false }
      - { label: "Tag", name: "tag", widget: "select", options: ["esej", "kritika", "film"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  # IZMENJEN DEO ZA TAGOVE
  - name: "tags"
    label: "Tagovi"
    files:
      - name: "tags"
        label: "Tagovi"
        file: "src/config/tags.json"
        fields:
          - label: "Tagovi"
            name: "tags"
            widget: "list"
            fields:
              - { label: "Ključ (npr. film)", name: "key", widget: "string" }
              - { label: "Naziv za prikaz", name: "label", widget: "string" }
              - { label: "Boja", name: "color", widget: "color" }