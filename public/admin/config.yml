backend:
  name: github
  repo: valsdjaaa/filmmort1
  branch: main
  base_url: https://cybernetic-cms-auth.nebojsa-beat.workers.dev
  auth_endpoint: /auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "texts"
    label: "Tekstovi"
    folder: "src/content/texts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Kicker", name: "kicker", widget: "string", required: false }
      - { label: "Pinned", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "Tags", name: "tags", widget: "list", default: ["film"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "tags"
    label: "Tagovi"
    folder: "src/config/tags"
    create: true
    slug: "{{key}}"
    fields:
      - { label: "Ključ (npr. film)", name: "key", widget: "string" }
      - { label: "Naziv za prikaz", name: "label", widget: "string" }
      - { label: "Boja", name: "color", widget: "color" }

  - name: "theme"
    label: "Izgled sajta"
    files:
      - name: "theme"
        label: "Boje i izgled"
        file: "src/config/theme.json"
        fields:
          - label: "Pride mode (dugine boje)"
            name: "prideMode"
            widget: "boolean"
            default: false
          - label: "Boja celog naslova"
            name: "titleColor"
            widget: "color"
            default: "#ffffff"
            required: false
          - label: "Pojedinačne boje"
            name: "customColors"
            widget: "list"
            required: false
            fields:
              - { label: "Deo (film ili mort)", name: "part", widget: "select", options: ["film", "mort"] }
              - { label: "Boja", name: "color", widget: "color" }